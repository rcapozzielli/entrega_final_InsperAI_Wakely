[project]
name = "wakely"
version = "0.1.0"
description = "Wakely: deteccao de sonolencia ao volante (entrega final Insper AI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "tqdm>=4.66",
    "kagglehub>=0.3",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "ultralytics>=8.4.202",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
